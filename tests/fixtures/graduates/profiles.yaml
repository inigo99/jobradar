# Sample graduate profiles for evaluating JobRadar across professions.
#
# Each CV in profiles/ is fictitious: a recent graduate with training, and at
# most an internship. For each one:
#   titles   what the person would search for in Spain, as Spanish ads write
#            them — the same as docs/STARTER_CONFIGS*.md suggest (a test keeps
#            them in step)
#   titles_en  the same for ads written in English, as the English guide
#            suggests (searched by tests/benchmark.py in Europe and the United States)
#   areas    Infoempleo areas for the profession; tests/benchmark.py reads their page in
#            each region it searches
#   work_modes  as the guide suggests
#   real_titles  titles of real ads for the profession, seen on public boards
#            in September 2026: the titles above must find every one
#   not_titles   real titles, or site links, the titles must not find
#   real_titles_en, not_titles_en  the same for titles_en, from ads seen on
#            EURES across Europe in September 2026
#   family   the job family a typical ad for them belongs to
#   skills   skills the CV must be read as proving (the offline tests check it)
#   ad       a typical junior ad, which the tests score against the CV
#   min_score the score that ad should reach at least
#
# tests/test_graduate_profiles.py runs these offline; tests/benchmark.py
# searches for real in the regions you pass it and writes a report.

