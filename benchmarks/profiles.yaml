# Sample graduate profiles for evaluating JobRadar across professions.
#
# Each CV in profiles/ is fictitious: a recent graduate with training, and at
# most an internship. For each one:
#   titles   what the person would search for (short, as ads write them)
#   family   the job family a typical ad for them belongs to
#   skills   skills the CV must be read as proving (the offline tests check it)
#   ad       a typical junior ad, which the tests score against the CV
#   min_score the score that ad should reach at least
#
# tests/test_graduate_profiles.py runs these offline; benchmarks/run.py
# searches for real in the regions you pass it and writes a report.

ingenieria:
  label: Ingeniería industrial
  titles: [ingeniero industrial, ingeniero de procesos, ingeniero de calidad, ingeniero junior]
  family: engineering
  skills: [technical_drawing, quality_control, health_safety]
  ad:
    title: Ingeniero/a de procesos junior
    description: >-
      Empresa del sector automoción busca ingeniero/a industrial recién titulado/a para el
      departamento de ingeniería de procesos. Funciones: mejora continua con Lean Manufacturing,
      análisis de tiempos, control de calidad según ISO 9001 y diseño de utillajes con AutoCAD o
      SolidWorks. Inglés B2. Se valorarán prácticas en planta.
  min_score: 60

