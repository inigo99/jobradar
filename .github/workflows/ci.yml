name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # People install it on their own laptops: the newest Python on each.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # tests/test_i18n.py reads the browser's translation catalogue with Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,parse,excel]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        if: runner.os == 'Linux'
        run: mypy src tests

      - name: Test
        # The suite is fully offline: every source is faked, so CI never
        # touches a job board.
        run: pytest -q

  package:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel and start from it
        # From the wheel, not the checkout: catches data files left out of it.
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/jobradar --home /tmp/jr demo --profile nurse
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Build the Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t jobradar .
      - name: Start it and load a page
        run: |
          docker run -d --name jobradar -p 127.0.0.1:8000:8000 jobradar
          for i in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8000/ && break; sleep 2; done
          curl -fsS -o /dev/null http://127.0.0.1:8000/
          docker exec jobradar jobradar doctor
