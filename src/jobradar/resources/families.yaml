# ---------------------------------------------------------------------------
# Job families: the kind of work an ad is for, in any sector.
#
# A family is used for three things:
#   1. Ordering: each family can carry a priority (Settings -> Job families),
#      which nudges the initial order of the board towards the work you want
#      more of. It never changes the match score shown next to a job.
#   2. Salary: when an ad publishes no figures, the band below is the starting
#      point of the estimate (see salary_bands.yaml for the rest of the maths).
#   3. CV variants: the profile can define, per family, which achievements and
#      skill groups a tailored CV leads with.
#
# How a job is classified: every keyword is matched as a whole word (or
# phrase) against the title — worth 3 points — and against the first part of
# the description — worth 1. The family with most points wins; ties go to the
# family listed first. `*` at the end of a keyword matches a prefix
# ("enferm*" matches enfermero, enfermera, enfermería).
#
# Bands: annual gross, in `salary_bands.yaml`'s base currency, for a
# Spain-level market (other countries are adjusted there). They are
# deliberately conservative starting points — edit them for your market, or
# override one family's band from Settings.
#
# Everything here can be renamed, extended or switched off from Settings; this
# file is only the default catalogue. Add a family by adding a block.
# ---------------------------------------------------------------------------

