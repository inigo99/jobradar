# ---------------------------------------------------------------------------
# Reference salary bands, used ONLY when an ad publishes no figures.
#
# Roughly two thirds of job ads hide the salary, so without an estimate the
# minimum-salary filter would silently drop almost everything. JobRadar
# therefore estimates a band and *always* marks it as an estimate
# (`salary.origin == "estimated"`), never as a published figure.
#
# The numbers below are deliberately conservative, annual, gross, in the
# currency named by `currency`, and are meant to be edited. Treat them as a
# starting point for your own market, not as authoritative data.
#
# Structure:
#   families:  <family key> -> <seniority> -> [min, max] in the base currency
#   base_currency: the currency the family bands are expressed in
#   country_multipliers: per-country cost/market adjustment applied to the band
#
# Seniority is inferred from the job title and the years of experience the ad
# asks for; see `jobradar/pipeline/salary.py`.
# ---------------------------------------------------------------------------

base_currency: EUR

families:
  software_engineering:
    junior: [22000, 32000]
    mid: [33000, 48000]
    senior: [48000, 70000]
    lead: [65000, 95000]
