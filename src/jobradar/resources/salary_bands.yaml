# ---------------------------------------------------------------------------
# Reference salary data, used ONLY when an ad publishes no figures.
#
# Roughly two thirds of job ads hide the salary, so without an estimate the
# minimum-salary filter would silently drop almost everything. JobRadar
# therefore estimates a band and *always* marks it as an estimate
# (`salary.origin == "estimated"`), never as a published figure, with a
# one-line account of how it was built so it can be checked and argued with.
#
# The estimate is:
#
#     family band (families.yaml, by seniority)
#       x company type factor            (company_types, below)
#       x hiring country multiplier      (country_multipliers, below)
#       x at most two adjustments        (adjustments, below)
#
# The country is where the candidate would be *hired*, not where the company
# has its headquarters: a German company hiring in Spain pays a Spanish band.
# For a remote job open to the candidate's own country, that is the
# candidate's country.
#
# Every number is deliberately conservative, annual, gross, in
# `base_currency`, and meant to be edited for your own market.
# ---------------------------------------------------------------------------

# Company type, detected from the ad's wording. The first type whose hints
# match wins; `unknown` applies when none do. Hints are whole words, and a
# trailing * matches a prefix.
company_types:
  public_sector:
    label: public sector
    factor: 0.95
    hints: ["administración pública", "public administration", ayuntamiento, "city council",
            "servicio público", "public service", "nhs", "sector público", "public sector",
            "universidad pública", "hospital público", oposición, oposiciones]
  non_profit:
    label: non-profit
    factor: 0.85
    hints: [ong, ngo, "non-profit", "nonprofit", "not-for-profit", fundación, foundation,
            charity, "sin ánimo de lucro", asociación]
  staffing_consultancy:
    label: consultancy or staffing agency
    factor: 0.90
    hints: [consultora, consultancy, "consulting firm", ett, "staffing agency",
            "recruitment agency", "on behalf of our client", "para importante empresa",
            "nuestro cliente", "our client", outsourcing, "empresa de trabajo temporal"]
  large_company:
    label: large company
    factor: 1.10
    hints: [multinacional, multinational, "fortune 500", "ibex", "global leader",
            "líder mundial", "more than 10,000 employees", "más de 10.000 empleados",
            "large corporation", "gran empresa"]
  startup:
    label: startup
    factor: 1.00
    hints: [startup, "start-up", "scale-up", scaleup, "series a", "series b", "seed round",
            "venture-backed"]
  small_business:
    label: small business
    factor: 0.92
    hints: [pyme, "small business", "family business", "empresa familiar", "sme",
            "small team", "pequeña empresa"]
  unknown:
    label: company of unknown type
    factor: 1.00
    hints: []

# Adjustments. At most two apply, the largest first, so a band cannot drift
# far on stacked guesses. `conditions` are evaluated in code
# (pipeline/salary.py::adjustments_for); only the factors are tuned here.
adjustments:
  asks_many_years:       {label: "asks for 5+ years", factor: 1.10}
  asks_few_years:        {label: "asks for 2 years or fewer", factor: 0.92}
  high_english:          {label: "requires fluent English in a non-English market", factor: 1.05}
  unnamed_client:        {label: "agency ad that does not name the employer", factor: 0.95}
  regulated_sector:      {label: "regulated sector (banking, insurance, pharma, energy)", factor: 1.05}

# When a published figure is converted to your currency and lands this close
# to your minimum salary, the filter keeps the job and asks you to check the
# day's exchange rate: dismissing a job over a stale rate is the one mistake
# that cannot be defended.
conversion_margin: 0.10

# Hiring-country multiplier applied to the base (Spain-level) band.
country_multipliers:
  ES: 1.00
  PT: 0.85
  IT: 0.95
  FR: 1.15
  DE: 1.30
  AT: 1.25
  NL: 1.30
  BE: 1.20
  IE: 1.30
  GB: 1.35
  CH: 1.90
  PL: 0.75
  US: 1.90
  CA: 1.40
  AU: 1.45
  NZ: 1.25
  SG: 1.30
  MX: 0.45
  BR: 0.40
  AR: 0.30
  CO: 0.30
  CL: 0.45
  IN: 0.30
  ZA: 0.40
  # Fully remote roles with no anchor country: assume a European-average band.
  _default: 1.00
