# Multiplier applied to the base (Spain-ish continental European) band.
country_multipliers:
  ES: 1.00
  PT: 0.85
  IT: 0.95
  FR: 1.15
  DE: 1.30
  AT: 1.25
  NL: 1.30
  BE: 1.20
  IE: 1.30
  GB: 1.35
  CH: 1.90
  PL: 0.75
  US: 1.90
  CA: 1.40
  AU: 1.45
  NZ: 1.25
  SG: 1.30
  MX: 0.45
  BR: 0.40
  AR: 0.30
  CO: 0.30
  CL: 0.45
  IN: 0.30
  ZA: 0.40
  # Fully remote roles with no anchor country: assume a European-average band.
  _default: 1.00
