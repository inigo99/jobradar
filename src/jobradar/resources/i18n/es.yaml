  es: 'No se ha podido guardar el archivo subido: {reason}.'
- en: Cannot read {name}.
  es: No se puede leer {name}.
- en: '{name} is password-protected.'
  es: '{name} está protegido con contraseña.'
- en: '{name} could not be read as a PDF: {reason}'
  es: '{name} no se ha podido leer como PDF: {reason}'
- en: '{name} could not be read as a Word document.'
  es: '{name} no se ha podido leer como documento de Word.'
- en: '{name} is not a text file.'
  es: '{name} no es un archivo de texto.'
- en: Reading your email needs {names}.
  es: Para leer tu correo hace falta {names}.
- en: 'Cannot connect to the mail server {server}: {reason}.'
  es: 'No se puede conectar con el servidor de correo {server}: {reason}.'
- en: '{server} refused the login for {user}.'
  es: '{server} ha rechazado el inicio de sesión de {user}.'
- en: The folder {folder} does not exist on {server}.
  es: La carpeta {folder} no existe en {server}.
- en: 'The mail server {server} answered with an error: {reason}.'
  es: 'El servidor de correo {server} ha respondido con un error: {reason}.'
- en: 'The connection to {server} dropped: {reason}.'
  es: 'Se ha cortado la conexión con {server}: {reason}.'
- en: The database {path} is locked by another process.
  es: La base de datos {path} está bloqueada por otro proceso.
- en: The database {path} is read-only.
  es: La base de datos {path} es de solo lectura.
- en: 'Could not write to the database {path}: {reason}.'
  es: 'No se ha podido escribir en la base de datos {path}: {reason}.'
- en: The stored {what} is corrupt and cannot be read.
  es: El registro guardado ({what}) está dañado y no se puede leer.
- en: 'The stored {what} is invalid: {reason}'
  es: 'El registro guardado ({what}) no es válido: {reason}'
- en: 'The stored profile is invalid: {reason}'
  es: 'El perfil guardado no es válido: {reason}'
- en: 'The stored job {job} is invalid: {reason}'
  es: 'La oferta guardada {job} no es válida: {reason}'
- en: 'The deleted job {job} cannot be restored: its saved copy is unreadable ({reason}).'
  es: 'La oferta borrada {job} no se puede recuperar: su copia guardada es ilegible ({reason}).'
- en: 'The CV template ''{name}'' could not be rendered: {reason}'
  es: 'La plantilla de CV «{name}» no se ha podido generar: {reason}'
- en: 'Cannot write the CV to {path}: {reason}.'
  es: 'No se puede escribir el CV en {path}: {reason}.'
- en: 'Invalid {what}: {reason}'
  es: '{what} no válido: {reason}'
