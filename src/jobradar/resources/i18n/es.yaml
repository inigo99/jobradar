patterns:
- en: you prioritise {family} (x{factor})
  es: das prioridad a {family} (x{factor})
- en: you deprioritise {family} (x{factor})
  es: restas prioridad a {family} (x{factor})
- en: 'Residency condition that names no country: “{sentence}” — confirm it covers yours.'
  es: 'Condición de residencia que no nombra país: «{sentence}»; confirma que incluye el tuyo.'
- en: Could not convert {currency}.
  es: No se ha podido convertir {currency}.
- en: 'Converted from {currency} at the rate of {date}: ≈ {amount} {target}, within {margin} of your minimum
    — check today''s rate before dismissing it.'
  es: 'Convertido desde {currency} al cambio del {date}: ≈ {amount} {target}, a menos del {margin} de
    tu mínimo; revisa el cambio de hoy antes de descartarla.'
- en: Estimated salary ≈ {amount} {currency}, below your minimum — an estimate, not the ad's figure.
  es: 'Salario estimado ≈ {amount} {currency}, por debajo de tu mínimo: es una estimación, no la cifra
    de la oferta.'
- en: published {age} days ago (limit {limit})
  es: publicada hace {age} días (límite {limit})
- en: work mode is {mode}
  es: la modalidad es {mode}
- en: on-site/hybrid outside your areas ({place})
  es: presencial/híbrido fuera de tus zonas ({place})
- en: remote but restricted to {where}
  es: remoto pero limitado a {where}
- en: remote limited to {where}
  es: remoto limitado a {where}
- en: salary ≈ {amount} {currency} (below {minimum} {currency2})
  es: salario ≈ {amount} {currency} (por debajo de {minimum} {currency2})
- en: asks for {years} years, you have {held} — just short by {short}
  es: 'pide {years} años y tienes {held}: te faltan {short}'
- en: asks for {years} years, you have {held} (short by {short})
  es: pide {years} años y tienes {held} (te faltan {short})
- en: excluded company ({company})
  es: empresa excluida ({company})
- en: published {age} days ago
  es: publicada hace {age} días
- en: asks for {years} years, you have {held}
  es: pide {years} años y tienes {held}
- en: salary ≈ {amount} {currency}
  es: salario ≈ {amount} {currency}
- en: excluded keyword '{word}'
  es: palabra excluida «{word}»
- en: duplicate of a job already on file ({company} — {title})
  es: duplicado de una oferta que ya tenías ({company} — {title})
- en: missing {names}
  es: falta {names}
- en: '{family} / {seniority} band'
  es: banda {family} / {seniority}
- en: hired in {where} x{factor}
  es: contratación en {where} x{factor}
- en: '{label} x{factor}'
  es: '{label} x{factor}'
- en: Converted from {currency} at the ECB rate of {date}
  es: Convertido desde {currency} al cambio del BCE del {date}
- en: '{score}/100 — {errors} to fix, {warnings} worth improving, {total} notes in total'
  es: '{score}/100: {errors} por corregir, {warnings} mejorables, {total} observaciones en total'
- en: '''{place}'' has no start date.'
  es: «{place}» no tiene fecha de inicio.
- en: '''{first}'' is listed before ''{second}'' but started earlier.'
  es: «{first}» aparece antes que «{second}» pero empezó antes.
- en: '{months} months between ''{older}'' and ''{newer}''.'
  es: '{months} meses entre «{older}» y «{newer}».'
- en: Only {count} of {total} achievements contain a number ({share}).
  es: Solo {count} de {total} logros incluyen una cifra ({share}).
- en: '''{place}'': an achievement starts with ''{opener}''.'
  es: '«{place}»: un logro empieza por «{opener}».'
- en: '''{place}'': an achievement runs to {n} characters.'
  es: '«{place}»: un logro ocupa {n} caracteres.'
- en: '''{place}'' has {n} achievements.'
  es: «{place}» tiene {n} logros.
- en: Beyond about {n} the later ones are not read. The tailoring step already orders them, so the weakest
    are last.
  es: A partir de unos {n}, los últimos no se leen. La adaptación ya los ordena, así que los más flojos
    quedan al final.
- en: '''{place}'' mixes ''-ing'' and past-tense openings.'
  es: «{place}» mezcla logros en gerundio y en pasado.
- en: '{n} achievements start with ''I'' or ''My''.'
  es: '{n} logros empiezan con «Yo» o «Mi».'
- en: The summary is {n} characters.
  es: El resumen tiene {n} caracteres.
- en: The CV contains '{phrase}'.
  es: El CV contiene «{phrase}».
- en: '{n} separate skills are listed.'
  es: Hay {n} competencias distintas en la lista.
- en: Past roughly {n} the list reads as keyword stuffing and devalues the ones you are actually good
    at.
  es: A partir de unas {n}, la lista parece relleno de palabras clave y resta valor a las que dominas
    de verdad.
- en: '''{skill}'' appears {n} times in the achievements.'
  es: «{skill}» aparece {n} veces en los logros.
- en: '{n} skills are listed but never appear in an achievement.'
  es: '{n} competencias están en la lista pero no aparecen en ningún logro.'
- en: '''{title}'' at {company} has no achievements.'
  es: «{title}» en {company} no tiene logros.
- en: '''{skill}'' is marked as demonstrated but no achievement mentions it.'
  es: «{skill}» figura como demostrada, pero ningún logro la menciona.
- en: '''{skill}'' has a ceiling of {cap} and no evidence.'
  es: «{skill}» tiene un techo de {cap} y ninguna evidencia.
- en: '''{skill}'' has a ceiling of {cap}, below its evidence of {base}.'
  es: «{skill}» tiene un techo de {cap}, por debajo de su evidencia de {base}.
- en: 'Listed but unknown to matching: {items}.'
  es: 'En la lista pero desconocidas para la coincidencia: {items}.'
- en: The rule '{rule}' encountered an error and could not finish.
  es: La regla «{rule}» ha fallado y no ha podido terminar.
- en: 'Error detail: {detail}'
  es: 'Detalle del error: {detail}'
- en: The CV runs to {pages} pages (limit {limit}).
  es: El CV ocupa {pages} páginas (límite {limit}).
- en: 'A generated draft was rejected: {note}'
  es: 'Se ha rechazado un borrador generado: {note}'
- en: 'Figures that are neither in your profile nor in the ad: {figures}.'
  es: 'Cifras que no están ni en tu perfil ni en la oferta: {figures}.'
- en: It says '{claim}' and your dated positions add up to {years}.
  es: Dice «{claim}» y tus puestos con fechas suman {years}.
- en: '''{skill}'' is not in your profile.'
  es: «{skill}» no está en tu perfil.
- en: 'Reads like a template: {phrases}.'
  es: 'Suena a plantilla: {phrases}.'
- en: '{n} part in brackets still to fill in, e.g. {example}.'
  es: '{n} parte entre corchetes por rellenar, p. ej. {example}.'
- en: '{n} parts in brackets still to fill in, e.g. {example}.'
  es: '{n} partes entre corchetes por rellenar, p. ej. {example}.'
- en: '{n} characters — the form cuts at {limit}.'
  es: '{n} caracteres: el formulario corta en {limit}.'
- en: '{n} words — the form cuts at {limit}.'
  es: '{n} palabras: el formulario corta en {limit}.'
- en: The document claims '{skill}', which your profile has no evidence for.
  es: El documento afirma «{skill}», y tu perfil no tiene evidencia de ello.
- en: The figure '{figure}' does not appear anywhere in your profile.
  es: La cifra «{figure}» no aparece en ninguna parte de tu perfil.
- en: The document claims {claimed} years of experience; your profile supports {actual}.
  es: El documento afirma {claimed} años de experiencia; tu perfil respalda {actual}.
- en: '''{name}'' is named but is not in your profile.'
  es: Se nombra «{name}», que no está en tu perfil.
- en: The CV still runs to {pages} pages at the smallest readable size. Shorten an achievement or drop
    an older position rather than shrinking further.
  es: El CV sigue ocupando {pages} páginas con la letra más pequeña legible. Acorta un logro o quita un
    puesto antiguo en lugar de reducir más.
- en: '{failure} The built-in PDF writer was used instead.'
  es: '{failure} Se ha usado en su lugar el creador de PDF integrado.'
- en: '''{place}'' has no achievements yet.'
  es: «{place}» aún no tiene logros.
- en: '{checked} messages read since {since}: {news} replies matched to jobs, {orphans} about applications
    not on the board.'
  es: '{checked} mensajes leídos desde el {since}: {news} respuestas asociadas a ofertas, {orphans} sobre
    candidaturas que no están en el tablero.'
- en: checked {checked}, closed {closed}, kept {tracked} tracked, {unreachable} unreachable
  es: revisadas {checked}, cerradas {closed}, {tracked} en seguimiento conservadas, {unreachable} inaccesibles
- en: Unknown job family '{family}'. Pick one from the list, or add it in Settings → Job families.
  es: 'Familia de empleo desconocida: «{family}». Elige una de la lista o añádela en Configuración → Familias
    de empleo.'
- en: Unknown document type '{kind}'; use cover_letter or email.
  es: 'Tipo de documento desconocido: «{kind}»; usa cover_letter o email.'
- en: '{name} is empty.'
  es: '{name} está vacío.'
- en: '{name} is larger than {mb} MB.'
  es: '{name} ocupa más de {mb} MB.'
