# Spanish text for what the server shows in the dashboard. See jobradar/i18n.py.
#
# exact     English sentence -> Spanish, looked up as is.
# patterns  English template -> Spanish; {name} matches any text, and that text
#           is looked up in `exact` too (a family label, a company type).
# skills    skill key -> display name (resources/skills.yaml).
# families  family key -> display name (resources/families.yaml).
#
# A sentence missing here is shown in English: add it rather than work around it.
exact:
  posted over a week ago: publicada hace más de una semana
  posted over two weeks ago: publicada hace más de dos semanas
  posted over three weeks ago — probably closed: 'publicada hace más de tres semanas: probablemente cerrada'
  the title is pitched at a senior or architect profile: el puesto apunta a un perfil sénior o de arquitectura
  publishes a salary band: publica banda salarial
  Listed as remote by the board, but the ad text never says so — confirm the work mode.: 'El portal la
    anuncia en remoto, pero el texto de la oferta no lo dice: confirma la modalidad.'
  Remote, but the ad does not say from which countries — confirm before applying.: 'Remoto, pero la oferta
    no dice desde qué países: confírmalo antes de aplicar.'
  The end client is not named — ask who the employer actually is.: 'No se nombra al cliente final: pregunta
    quién es realmente la empresa.'
  Salary is an estimate, not a published figure.: El salario es una estimación, no una cifra publicada.
  Work mode unclear — check whether office days are expected.: 'Modalidad poco clara: comprueba si esperan
    días de oficina.'
  No publication date; the ad may be older than it looks.: Sin fecha de publicación; la oferta puede ser
    más antigua de lo que parece.
  Remote with a residency condition that names no country — confirm it covers yours.: 'Remoto con una
    condición de residencia que no nombra país: confirma que incluye el tuyo.'
  Remote scope not stated — confirm you may work from your country.: 'No indica desde dónde se puede trabajar
    en remoto: confirma que puedes hacerlo desde tu país.'
  No salary information at all.: Ningún dato de salario.
  no publication date: sin fecha de publicación
  publication date is in the future: fecha de publicación en el futuro
  international remote is switched off: el remoto internacional está desactivado
  no published salary: sin salario publicado
  none of the required keywords present: no aparece ninguna de las palabras obligatorias
  deleted by you: borrada por ti
  on-site/hybrid outside your areas: presencial/híbrido fuera de tus zonas
  excluded company: empresa excluida
  duplicate of a job already on file: duplicado de una oferta que ya tenías
  previously recorded as closed: ya registrada como cerrada
  weekly source, not its day: fuente semanal, hoy no le toca
  'Estimated: no salary published': 'Estimado: la oferta no publica salario'
  No reference band for this role.: No hay banda de referencia para este puesto.
  Edit resources/families.yaml and salary_bands.yaml to match your market.: Edita resources/families.yaml
    y salary_bands.yaml para ajustarlos a tu mercado.
  Published in the job ad.: Publicado en la oferta.
  Published in the job ad (read by the language model).: Publicado en la oferta (leído por el modelo de
    lenguaje).
  typed in by you: introducido por ti
  no anchor country: sin país de referencia
  junior: junior
  mid: intermedio
  senior: sénior
  lead: responsable
  public sector: sector público
  non-profit: entidad sin ánimo de lucro
  consultancy or staffing agency: consultora o empresa de trabajo temporal
  large company: gran empresa
  startup: startup
  small business: pequeña empresa
  company of unknown type: empresa de tipo desconocido
  asks for 5+ years: pide 5 años o más
  asks for 2 years or fewer: pide 2 años o menos
  requires fluent English in a non-English market: exige inglés fluido en un mercado no anglófono
  agency ad that does not name the employer: oferta de agencia que no nombra a la empresa
  regulated sector (banking, insurance, pharma, energy): sector regulado (banca, seguros, farmacia, energía)
  under 60 %: menos del 60 %
  60–75 %: 60–75 %
  75–90 %: 75–90 %
  90 % or more: 90 % o más
  Days to a week on top of what you already know — worth a look before an interview.: 'De unos días a
    una semana sobre lo que ya sabes: merece un repaso antes de una entrevista.'
  Several weeks of real work to discuss it with any authority, rather than by hearsay.: Varias semanas
    de trabajo real para poder hablar de ello con criterio y no de oídas.
  Not realistic inside one hiring process. Prepare an honest answer instead of cramming.: No es realista
    dentro de un proceso de selección. Prepara una respuesta honesta en vez de estudiarlo a la carrera.
  The CV has no name on it.: El CV no lleva nombre.
  No email address.: No hay dirección de correo.
  Email is how almost every reply arrives. It has to be there.: Casi todas las respuestas llegan por correo.
    Tiene que estar.
  Only an email address — no phone or LinkedIn.: 'Solo hay correo: ni teléfono ni LinkedIn.'
  Recruiters routinely call before they write.: Los reclutadores suelen llamar antes de escribir.
  An undated position is assumed to be short or to be padding.: Un puesto sin fechas se da por breve o
    por relleno.
  ? Reverse-chronological order is what every reader expects. Reordering jobs to lead with the most relevant
    one is spotted immediately.
  : El orden cronológico inverso es lo que espera cualquier lector. Reordenar los puestos para poner primero
    el más relevante se nota enseguida.
  ? Not a problem in itself — an unexplained one is. A one-line entry (study, caring, contracting, a deliberate
    break) closes it.
  : No es un problema en sí; sí lo es sin explicar. Una línea (estudios, cuidados, trabajos por cuenta
    propia, una pausa elegida) lo resuelve.
  No achievements are listed under any position.: No hay logros en ningún puesto.
  A CV without achievements gives a reader nothing to compare.: Un CV sin logros no le da al lector nada
    que comparar.
  ? Aim for half or more. 'Cut processing time by 85%' lands; 'improved processing time' does not. Estimates
    are fine if you can defend them.
  : Apunta a la mitad o más. «Reduje el tiempo de proceso un 85 %» se entiende; «mejoré el tiempo de proceso»,
    no. Las estimaciones valen si puedes defenderlas.
  'Start with the result and the verb that produced it: ''Cut X by N% by doing Z''.': 'Empieza por el
    resultado y el verbo que lo produjo: «Reduje X un N % haciendo Z».'
  Two lines is the limit in a scan. Split it or cut the setup.: Dos líneas es el límite en una lectura
    rápida. Divídelo o recorta el contexto.
  The tailoring step already orders them, so the weakest are last.: La adaptación ya los ordena, así que
    los más flojos quedan al final.
  Pick one and keep it across the whole CV.: Elige uno y mantenlo en todo el CV.
  'CV convention drops the pronoun: ''Cut errors by 50%…''.': 'En un CV se omite el pronombre: «Reduje
    los errores un 50 %…».'
  There is no professional summary.: No hay resumen profesional.
  The first three lines decide whether the rest is read.: Las tres primeras líneas deciden si se lee el
    resto.
  Three to five sentences. Anything longer is skipped.: De tres a cinco frases. Lo que pase de ahí se
    salta.
  The summary contains no concrete figure.: El resumen no incluye ninguna cifra concreta.
  One real number in the opening paragraph does more than a paragraph of adjectives.: Una cifra real en
    el párrafo inicial hace más que un párrafo de adjetivos.
  ? Say the thing it is standing in for, or cut it. Everyone claims this; nobody is asked to prove it,
    which is exactly why it carries no weight.
  : Di lo que está sustituyendo o quítalo. Todo el mundo lo afirma y nadie tiene que demostrarlo, y por
    eso mismo no pesa nada.
  Repetition does not improve ATS ranking on any modern system.: Repetir no mejora la posición en ningún
    ATS moderno.
  ? Fine for tools you genuinely use; a long list of them invites the interview question you least want.
    Consider trimming the weakest.
  : Está bien para herramientas que usas de verdad; una lista larga invita a la pregunta de entrevista
    que menos quieres. Plantéate quitar las más flojas.
  The summary is mostly acronyms.: El resumen es casi todo siglas.
  The first reader is often not technical. Say what you did, then name the tools.: El primer lector a
    menudo no es técnico. Di qué hiciste y luego nombra las herramientas.
  Add one or two results from that job. Without them it proves no skill, so nothing from it can be used to match an ad.: Añade
    uno o dos resultados de ese trabajo. Sin ellos no demuestra ninguna competencia y no sirve para encajar
    con una oferta.
  ? 'Either the achievement that proved it changed, or it is written differently in the CV. Until then,
    matching counts it as proven: lower its evidence in Settings, or name it in the achievement that shows
    it.'
  : 'O ha cambiado el logro que la demostraba, o en el CV se escribe de otra forma. Mientras tanto la
    coincidencia la cuenta como demostrada: baja su evidencia en Configuración o nómbrala en el logro
    que la muestra.'
  ? A skill your CV does not show can never be raised, so this ceiling is ignored — but it says you could
    claim something you do not have. Remove it, or add the evidence first.
  : Una competencia que tu CV no muestra nunca puede subir, así que este techo se ignora; pero sugiere
    que podrías presumir de algo que no tienes. Quítalo o añade antes la evidencia.
  A tailored CV never lowers what is already proven, so this ceiling means nothing. Set it at least to the evidence.: Un
    CV adaptado nunca baja lo que ya está demostrado, así que este techo no significa nada. Ponlo al menos
    al nivel de la evidencia.
  Add them in Settings → Your skills with the evidence you have, so ads that ask for them count them.: Añádelas
    en Configuración → Tus competencias con la evidencia que tengas, para que cuenten en las ofertas que
    las pidan.
  Cut the oldest position's weakest achievement first; it is the one a reader is least likely to reach.: 'Quita
    primero el logro más flojo del puesto más antiguo: es el que menos probabilidades tiene de leerse.'
  The deterministic version was used instead.: Se ha usado en su lugar la versión determinista.
  Models round numbers without saying so, and this is the figure you will be asked about. Use the real one or drop it.: Los
    modelos redondean cifras sin avisar, y es justo la cifra por la que te preguntarán. Usa la real o
    quítala.
  If that is what the ad asks for, make it clear the sentence is about them.: Si es lo que pide la oferta,
    deja claro que la frase habla de ellos.
  Naming it as a gap is honest; it must not read as if you had it.: Nombrarla como carencia es honesto;
    no debe sonar a que la tienes.
  Say the specific thing instead, in your own words.: Di en su lugar lo concreto, con tus palabras.
  It never names the company.: No nombra a la empresa en ningún sitio.
  A letter that fits any company reads as exactly that.: Una carta que vale para cualquier empresa se
    lee exactamente así.
  The email does not start with a subject line.: El correo no empieza con una línea de asunto.
  'Start with ''Subject: …'' so it can be pasted as is.': 'Empieza con «Asunto: …» para poder pegarlo
    tal cual.'
  There is no [name] placeholder in the greeting.: El saludo no lleva el marcador [nombre].
  If you do not know who reads it, keep the greeting without a name.: Si no sabes quién lo lee, deja el
    saludo sin nombre.
  They are there because the fact is not in your profile.: Están ahí porque ese dato no está en tu perfil.
  Ask for a shorter version in the thread, or trim it.: Pide una versión más corta en el hilo o recórtala.
  Either remove it, or add real evidence for it to your profile and re-generate.: Quítala, o añade evidencia
    real en tu perfil y vuelve a generar.
  Numbers on a CV get asked about. Use the real one or drop the claim.: Por las cifras de un CV se pregunta.
    Usa la real o quita la afirmación.
  Count only what your dated positions add up to.: Cuenta solo lo que suman tus puestos con fechas.
  Fine if it is the company you are applying to; otherwise remove it.: Bien si es la empresa a la que
    aplicas; si no, quítala.
  ? 'Playwright is not installed, so the CV was printed with the built-in PDF writer (plainer layout).
    For the HTML template''s typography: pip install ''jobradar[pdf]'' && playwright install chromium'
  : 'Playwright no está instalado, así que el CV se ha generado con el creador de PDF integrado (diseño
    más sencillo). Para la tipografía de la plantilla HTML: pip install ''jobradar[pdf]'' && playwright
    install chromium'
  Very little text could be read from that file — check it is not a scan.: 'Se ha podido leer muy poco
    texto de ese archivo: comprueba que no sea un escaneo.'
  The language model could not parse the CV; fell back to the text parser.: El modelo de lenguaje no ha
    podido interpretar el CV; se ha usado el lector de texto.
  ? 'Parsed without a language model: review the experience, dates and skills, which the text parser gets
    approximately right at best.'
  : 'Leído sin modelo de lenguaje: revisa la experiencia, las fechas y las competencias, que el lector
    de texto acierta como mucho de forma aproximada.'
  Could not find your name in the CV — add it in settings.: 'No se ha encontrado tu nombre en el CV: añádelo
    en Configuración.'
  No work experience was recognised — add at least one position.: 'No se ha reconocido experiencia laboral:
    añade al menos un puesto.'
  No profile yet — finish the setup first.: 'Aún no hay perfil: termina primero la configuración.'
  That job is not on the board any more; reload the page.: Esa oferta ya no está en el tablero; recarga
    la página.
  No file was attached; choose your CV file first.: No se ha adjuntado ningún archivo; elige primero tu
    CV.
  No CV has been generated for this job yet; press Tailor CV first.: Aún no se ha generado un CV para
    esta oferta; pulsa antes «Adaptar CV».
  The CV file is gone from disk — generate it again: 'El archivo del CV ya no está en el disco: vuelve
    a generarlo'
  That document has not been written yet; press Cover letter or Application email first.: Ese documento
    aún no está redactado; pulsa antes «Carta de presentación» o «Correo de candidatura».
  There is no answer at that position in this job's thread; reload it.: No hay ninguna respuesta en esa
    posición del hilo de esta oferta; recárgalo.
  An answer cannot be empty; write something or delete the thread.: Una respuesta no puede quedar vacía;
    escribe algo o vacía el hilo.
  That answer is no longer in the bank; reload the page.: Esa respuesta ya no está en el banco; recarga
    la página.
  Finish the setup first: Termina primero la configuración
  A search is already running: Ya hay una búsqueda en marcha
  A sweep is already running: Ya hay una revisión de ofertas cerradas en marcha
  No interview time was found for this job: No se ha encontrado hora de entrevista para esta oferta
  That ad is no longer in the filtered list; reload the page.: Esa oferta ya no está en la lista de filtradas;
    recarga la página.
  The uploaded file has no usable name.: El archivo subido no tiene un nombre utilizable.
  Rename the file (e.g. cv.pdf) and upload it again.: Cambia el nombre del archivo (p. ej. cv.pdf) y vuelve
    a subirlo.
  Upload the CV file itself.: Sube el propio archivo del CV.
  Upload a smaller export of your CV (PDF or DOCX).: Sube una exportación más ligera de tu CV (PDF o DOCX).
  Check that the data directory is writable.: Comprueba que se puede escribir en la carpeta de datos.
  No text could be read from the CV.: No se ha podido leer texto del CV.
  If it is a scanned PDF, export a text PDF or paste the text instead.: Si es un PDF escaneado, exporta
    un PDF con texto o pega el texto.
  Reading PDF CVs needs the 'parse' extra.: Leer CV en PDF necesita el complemento «parse».
  Reading Word CVs needs the 'parse' extra.: Leer CV en Word necesita el complemento «parse».
  Save an unprotected copy of the PDF and upload that.: Guarda una copia del PDF sin contraseña y súbela.
  Re-export it from your editor, or upload the .docx version.: Vuelve a exportarlo desde tu editor o sube
    la versión .docx.
  Open it in Word and save it again as .docx, or upload a PDF.: Ábrelo en Word y guárdalo de nuevo como
    .docx, o sube un PDF.
  'Supported formats: PDF, DOCX, HTML, Markdown or plain text.': 'Formatos admitidos: PDF, DOCX, HTML,
    Markdown o texto plano.'
  Old Word .doc files cannot be read; save it as .docx or PDF.: Los archivos .doc antiguos no se pueden
    leer; guárdalo como .docx o PDF.
  OpenDocument files cannot be read; export it as PDF or .docx.: Los archivos OpenDocument no se pueden
    leer; expórtalo como PDF o .docx.
  Pages files cannot be read; export it as PDF or .docx.: Los archivos de Pages no se pueden leer; expórtalo
    como PDF o .docx.
  Images cannot be read; upload the PDF or Word version of your CV.: Las imágenes no se pueden leer; sube
    la versión en PDF o Word de tu CV.
  No job source can run with the current settings.: Con la configuración actual no puede funcionar ninguna
    fuente.
  Enable at least one source (see 'jobradar sources'), or set the API keys the enabled ones need.: Activa
    al menos una fuente (mira «jobradar sources») o configura las claves que necesitan las activas.
  Add them to .env (see .env.example). Use an app password, not your normal one.: Añádelas a .env (mira
    .env.example). Usa una contraseña de aplicación, no la normal.
  Check JOBRADAR_IMAP_HOST and JOBRADAR_IMAP_PORT (usually 993).: Revisa JOBRADAR_IMAP_HOST y JOBRADAR_IMAP_PORT
    (normalmente 993).
  ? 'Use an app password (Gmail: myaccount.google.com/apppasswords; Outlook: account security settings),
    and check IMAP is enabled for the account.'
  : 'Usa una contraseña de aplicación (Gmail: myaccount.google.com/apppasswords; Outlook: ajustes de seguridad
    de la cuenta) y comprueba que IMAP está activado en la cuenta.'
  Check JOBRADAR_IMAP_FOLDER, or leave it empty for INBOX.: Revisa JOBRADAR_IMAP_FOLDER o déjalo vacío
    para usar la bandeja de entrada.
  Try again; if it keeps happening, check your network.: Vuelve a intentarlo; si sigue pasando, revisa
    tu conexión.
  Wait for the other JobRadar command (or the dashboard's search) to finish.: Espera a que termine el
    otro comando de JobRadar (o la búsqueda del panel).
  Check the permissions of the data directory.: Revisa los permisos de la carpeta de datos.
  Free some disk space and try again.: Libera espacio en disco y vuelve a intentarlo.
  Restore the database from a backup, or delete that record.: Restaura la base de datos desde una copia
    o borra ese registro.
  Restore the database from a backup, or regenerate that record.: Restaura la base de datos desde una
    copia o vuelve a generar ese registro.
  Import your CV again with 'jobradar init --cv <file>'.: Vuelve a importar tu CV con «jobradar init --cv
    <archivo>».
  Run the search again; the job will be re-read from its board.: Vuelve a lanzar la búsqueda; la oferta
    se releerá desde su portal.
  It will come back on the next search if the ad is still published.: Volverá en la próxima búsqueda si
    la oferta sigue publicada.
  Empty the filtered list with 'jobradar filtered --clear'.: Vacía la lista de filtradas con «jobradar
    filtered --clear».
  Set its status again from the dashboard.: Vuelve a indicar su estado desde el panel.
  Clear the thread from the dashboard to start it again.: Vacía el hilo desde el panel para empezar de
    nuevo.
  The CV templates are missing from the installation.: Faltan las plantillas del CV en la instalación.
  Reinstall JobRadar.: Reinstala JobRadar.
  If you edited the template, check its syntax.: Si editaste la plantilla, revisa su sintaxis.
  Check that the data directory is writable and the disk is not full.: Comprueba que se puede escribir
    en la carpeta de datos y que el disco no está lleno.
  See docs/CONFIGURATION.md for the accepted values.: Consulta docs/CONFIGURATION.md para ver los valores
    admitidos.
  Point --home (or JOBRADAR_HOME) at a folder you can write to.: Indica en --home (o JOBRADAR_HOME) una
    carpeta en la que se pueda escribir.
  Move it aside or choose another data directory.: Muévelo o elige otra carpeta de datos.
  Restore the database from a backup, or set it up again.: Restaura la base de datos desde una copia o
    vuelve a configurarla.
  Something went wrong on the server. The details are in the terminal running 'jobradar serve'.: Algo
    ha fallado en el servidor. Los detalles están en la terminal donde se ejecuta «jobradar serve».
