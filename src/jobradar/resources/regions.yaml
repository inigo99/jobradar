# ---------------------------------------------------------------------------
# Sub-national regions, by NUTS code.
#
# Some boards publish only a region code instead of a town — EURES gives the
# NUTS-3 code (a province, in Spain) and searches by NUTS-2. This file turns
# those codes into names, so a "Barcelona" or "Pamplona" in your areas can be
# matched against them, and your areas into codes a board can search by.
#
# Each NUTS-3 entry: `name`, the NUTS-2 `region` it belongs to, and `places`:
# other names people use for it (capital, main towns, co-official names).
# The province is the finest grain these boards give, so an area resolves to
# its whole province: "Pamplona" also keeps a job in Tudela.
#
# Adding a country is a block like ES below. Nothing else needs to change.
# ---------------------------------------------------------------------------

ES:
  regions:
    ES11: Galicia
    ES12: Asturias
    ES13: Cantabria
    ES21: País Vasco
    ES22: Navarra
    ES23: La Rioja
    ES24: Aragón
    ES30: Comunidad de Madrid
    ES41: Castilla y León
    ES42: Castilla-La Mancha
    ES43: Extremadura
    ES51: Cataluña
