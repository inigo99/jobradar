# ---------------------------------------------------------------------------
# Generic skill taxonomy.
#
# Used for two things:
#   1. Turning a job ad into weighted requirements without a language model.
#   2. Giving each requirement a stable key so it can be compared against the
#      candidate's profile evidence.
#
# `aliases` are matched case-insensitively as whole words against the ad text,
# so short or ambiguous aliases ("r", "go") are written with enough context to
# avoid false positives.
#
# The taxonomy is intentionally cross-industry: JobRadar is not an
# engineering-only tool. Add whatever your field needs — a key that is missing
# simply means that requirement is matched by its literal wording instead.
# ---------------------------------------------------------------------------

