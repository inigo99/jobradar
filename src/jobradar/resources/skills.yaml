# ---------------------------------------------------------------------------
# Learning difficulty.
#
# For a requirement the candidate cannot evidence, this says whether it is
# worth reading up on between sending the application and sitting an
# interview. It does NOT decide what counts as a gap — the profile's evidence
# does that — and it never puts anything on a CV. A "fast" gap goes on the CV
# when it has actually been learnt, not before.
#
#   fast    days to a week on top of an existing base: a library, a tool
#   medium  several weeks of real work to discuss it with authority
#   slow    not realistic inside one hiring process: a deep discipline, a
#           heavy certification, a degree, a new language, or years of
#           experience. Here the honest answer beats the crash course.
#
# Resolution order: a skill's own `difficulty:` field, then `overrides`, then
# `by_group`, then `default`. Editing this costs nothing downstream.
# ---------------------------------------------------------------------------
