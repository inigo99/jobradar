# ---------------------------------------------------------------------------
# Country registry.
#
# `jobradar init` asks which country you work from and uses this file to pick
# sensible defaults: the currency the salary filter is expressed in, the
# language job ads are usually written in, and which national job boards are
# worth enabling.
#
# Adding a country is a pull request against this file plus (optionally) a
# source adapter under `jobradar/sources/`. Nothing else needs to change.
# ---------------------------------------------------------------------------

ES:
  name: Spain
  currency: EUR
  languages: [es, en]
  adzuna: es
  national_sources: [infojobs, tecnoempleo]     # opt-in, see docs/SOURCES.md
  notes: "InfoJobs and Tecnoempleo publish salary bands more often than LinkedIn."

