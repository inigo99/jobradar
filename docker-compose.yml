services:
  jobradar:
    build: .
    image: jobradar
    container_name: jobradar
    restart: unless-stopped
    ports:
      # Loopback only: the dashboard holds your CV and your job search and has
      # no login. Publish it wider only behind something that authenticates.
      - "127.0.0.1:8000:8000"
    volumes:
      # Everything JobRadar saves — database, settings, CVs — lives in this
      # volume and survives upgrades. To keep it in a folder instead, use
      # `- ./data:/data` and create ./data first, owned by user id 1000.
      - jobradar-data:/data
    environment:
      # The names the dashboard may be reached by (the Host header check).
      - JOBRADAR_ALLOWED_HOSTS=localhost,127.0.0.1
    # Keys for a language model or the credentials sources go in .env next to
    # this file (see .env.example); it is optional.
    env_file:
      - path: .env
        required: false

volumes:
  jobradar-data:
